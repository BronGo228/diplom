<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Components Audit & Inventory</title>
    <meta name="description" content="Учет и аудит радиоэлектронных компонентов.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark-theme">
    <div id="login-screen" class="glass-panel">
        <div class="login-box">
            <div class="logo-large">
                <div class="logo-icon glow"></div>
                <h1>ElecTrack</h1>
            </div>
            <p class="subtitle">Система учета радиоэлектронных компонентов</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" required placeholder="Введите логин">
                </div>
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn-primary">Войти в систему</button>
            </form>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="glass-panel">
            <div class="logo">
                <div class="logo-icon"></div>
                <h2>ElecTrack</h2>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" data-view="dashboard">
                    <span class="icon">📊</span> Дашборд
                </button>
                <button class="nav-btn" data-view="inventory">
                    <span class="icon">💻</span> Номенклатура
                </button>
                <button class="nav-btn" data-view="warehouse">
                    <span class="icon">🗄️</span> Склад и Ячейки
                </button>
                <button class="nav-btn" data-view="inbound">
                    <span class="icon">📥</span> Приемка
                </button>
                <button class="nav-btn" data-view="requests">
                    <span class="icon">📝</span> Заявки (BOM)
                </button>
                <button class="nav-btn" data-view="audit">
                    <span class="icon">🔍</span> Аудит
                </button>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar glow"></div>
                    <div class="details">
                        <span id="current-username" class="name">Менеджер</span>
                        <span id="current-role" class="role">Admin</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn-icon">🚪</button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main id="main-content">
            <header class="topbar glass-panel">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="global-search" placeholder="Поиск по партномеру, штрихкоду или названию...">
                </div>
                <div class="topbar-actions">
                    <button class="btn-icon glow-hover" title="Сканировать Штрихкод">📷</button>
                    <button class="btn-icon glow-hover" title="Уведомления">🔔</button>
                </div>
            </header>
            
            <div id="view-container">
                <!-- Dynamic views load here -->
            </div>
        </main>
    </div>
    
    <!-- Templates for Views -->
    <template id="tpl-dashboard">
        <div class="view-header">
            <h1>Обзор склада</h1>
            <p>Текущая статистика и важные уведомления</p>
        </div>
        <div class="dashboard-grid">
            <div class="stat-card glass-panel interactive">
                <div class="stat-icon">📦</div>
                <div class="stat-data">
                    <span class="stat-value">1,204</span>
                    <span class="stat-label">Уникальных компонентов</span>
                </div>
            </div>
            <div class="stat-card glass-panel interactive">
                <div class="stat-icon">🔖</div>
                <div class="stat-data">
                    <span class="stat-value">5,840</span>
                    <span class="stat-label">Активных партий (Бабин)</span>
                </div>
            </div>
            <div class="stat-card glass-panel interactive warning">
                <div class="stat-icon">⚠️</div>
                <div class="stat-data">
                    <span class="stat-value">12</span>
                    <span class="stat-label">Заканчиваются на складе</span>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-inventory">
        <div class="view-header">
            <div class="header-left">
                <h1>Номенклатура</h1>
                <p>Все зарегистрированные радиокомпоненты и аналоги</p>
            </div>
            <button class="btn-primary" onclick="window.app.showAddComponentModal()">+ Добавить Компонент</button>
        </div>
        <div class="glass-panel table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Наименование</th>
                        <th>Партномер (PN)</th>
                        <th>Категория</th>
                        <th>Производитель</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="components-table-body">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
